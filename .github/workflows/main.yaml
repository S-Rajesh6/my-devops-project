name: Build and Test Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-app-image:$(date +%s)

    - name: Run basic checks
      run: |
        echo "Image built successfully!"
        # Add a check to see if the app starts
        docker run -d -p 3000:3000 --name test-container my-app-image
        sleep 5
        curl localhost:3000/health